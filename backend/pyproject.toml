[project]
name = "career-os"
version = "0.1.0"
description = "Career planning agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "langgraph",
    "langchain-core",
    "litellm",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["career_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: requires live LLM",
    "no_llm: deterministic L1 eval",
]
